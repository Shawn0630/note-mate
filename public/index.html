<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply the saved theme before first paint (no flash). Default is the
  // current light look: no attribute means light.
  try {
    var __nmTheme = localStorage.getItem('nm-theme');
    if (__nmTheme === 'dark' || __nmTheme === 'light') document.documentElement.setAttribute('data-theme', __nmTheme);
  } catch (e) {}
</script>
<title>Note Mate — Your Reading Shelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236b4a2f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='bold' fill='%23f8efdd' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
<script src="./vendor/marked.umd.js"></script>
</head>
<body>
<div id="app" class="app">
  <header class="app-header">
    <a class="brand" href="#/">Note Mate</a>
    <span class="brand-sub">read &amp; take notes, side by side</span>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Switch to dark theme" aria-label="Switch to dark theme">🌙</button>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
